model:
  target_model_path: ${oc.env:QWEN3_8B_PATH}
  draft_model_config: ${oc.env:TORCHSPEC_REPO}/configs/draft_models/qwen3_8b_eagle3.json
  target_model_backend: hf
  trust_remote_code: false
dataset:
  train_data_path: ${oc.env:PR193_WORK}/train.parquet
  eval_data_path: ${oc.env:PR193_WORK}/eval.parquet
  eval_interval: 100
  chat_template: qwen
  prompt_key: conversations
  shuffle_dataset: false
  length_group_size: 1
  last_turn_loss_only: auto
training:
  attention_backend: flex_attention
  micro_batch_size: 1
  draft_accumulation_steps: 1
  learning_rate: 0.0001
  max_grad_norm: 0.5
  max_seq_length: 4096
  num_epochs: 1
  num_train_steps: 1000
  ttt_length: 7
  gradient_checkpointing: true
  seed: 42
  warmup_ratio: 0.015
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  max_concurrent_batches: 1
  prefetch_depth: 1
  save_interval: 1000
  save_per_epoch: true
inference:
  inference_engine_type: hf
  last_hidden_states_prenorm: false
  inference_num_gpus: 1
  inference_num_gpus_per_node: 1
  inference_num_gpus_per_engine: 1
  inference_batch_size: 1
  inference_buffer_threshold: 2
  max_sample_pool_size: 4
  aux_hidden_states_layers: [1, 15, 28]
mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 2GB
  local_buffer_size: 1GB
output_dir: ${oc.env:PR193_WORK}/train-default
cache_dir: ${oc.env:PR193_WORK}/cache
logging:
  report_to: none
